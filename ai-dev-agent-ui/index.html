<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>codeFlow · AI 辅助开发工作台</title>
    <link rel="preconnect" href="https://fonts.loli.net" />
    <link
      href="https://fonts.loli.net/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 初始主题与 localStorage 同步，避免刷新时闪烁
      document.documentElement.classList.toggle(
        'dark',
        localStorage.getItem('cf-theme') === 'dark'
      )
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
